<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
{% assign desc = page.description | default: site.description %}
{% assign img = page.imagen | default: '/assets/img/compartir/portafolio.jpg' %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_CL">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
<meta property="og:description" content="{{ desc }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ img | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Archivo:wght@500;600;700&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/estilos.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script src="{{ '/assets/js/menu.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
{% for s in page.scripts %}<script src="{{ s | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
{% endfor %}
</head>
<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
{% include encabezado.html %}
<main id="contenido">
{{ content }}
</main>
{% include pie.html %}
</body>
</html>
